<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bfd59b">
  <meta name="description" content="Tres sorpresas para empezar tu cumpleaños a tu manera.">
  <title>Feliz cumpleaños niña bonita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #293720;
      --muted: #4c5d3c;
      --purple: #405c2e;
      --line: #a7bd87;
      --paper: #bfd59b;
      --display: 'Instrument Serif', Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 'DM Sans', system-ui, sans-serif; }
    button { font: inherit; cursor: pointer; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 3px solid #47672f; outline-offset: 4px; }
    [hidden] { display: none !important; }
    h1, h2, h3, p, figure { margin: 0; }
    h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1; }
    h1:focus, h2:focus { outline: none; }
    img { display: block; max-width: 100%; }
    .wrap { width: min(1080px, calc(100% - 64px)); margin-inline: auto; }
    .masthead { display: flex; align-items: center; justify-content: space-between; min-height: 75px; gap: 1rem; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: .6rem; padding: .45rem 0; border: 0; color: var(--ink); background: none; font-weight: 700; }
    .brand span { color: var(--purple); font-size: 1.3rem; line-height: 1; }
    .masthead-actions { display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
    .date { color: var(--muted); font-size: .8rem; font-weight: 700; }
    main { padding-block: 29px 0; }
    .hero { position: relative; display: grid; grid-template-columns: 1.25fr 1fr; isolation: isolate; overflow: hidden; min-height: 405px; border-radius: 27px; border: 1px solid #a9bf89; background: linear-gradient(110deg, #dce9c4 7%, #cfdfb1 50%, #bfd59b 100%); }
    .hero-content { z-index: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 0; padding: 38px 20px 41px clamp(24px, 4vw, 45px); }
    .greeting { display: inline-flex; align-items: center; gap: .52rem; color: #466334; font-size: .82rem; font-weight: 700; margin-bottom: 17px; }
    .greeting span { font-size: 1rem; }
    .hero h1 { font-size: clamp(3.1rem, 5.5vw, 4.7rem); line-height: .98; letter-spacing: -.027em; }
    .hero h1 em { color: #496535; }
    .hero p { color: #445637; max-width: 340px; margin: 19px 0 24px; }
    .hero-art { position: relative; display: grid; place-items: center; align-self: start; margin: 0; padding: 38px 22px; }
    .hero-art img { width: 100%; max-width: 380px; aspect-ratio: 1; object-fit: contain; border-radius: 22px; }
    
    .button { display: inline-flex; width: fit-content; justify-content: center; align-items: center; gap: .8rem; min-height: 46px; padding: .57rem 1.12rem; border: 1px solid transparent; border-radius: 999px; background: var(--purple); color: white; font-size: .89rem; font-weight: 700; text-decoration: none; transition: background .2s, transform .2s; }
    .button:hover { background: #304622; transform: translateY(-2px); }
    .button.secondary { background: transparent; color: var(--purple); border-color: #97b174; }
    .button.secondary:hover { background: #d6e5be; }
    .choices { margin-top: 30px; scroll-margin-top: 20px; }
    .choices-head { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem 1rem; margin-bottom: 15px; }
    .choices h2 { font-size: clamp(2rem, 4vw, 2.75rem); }
    .progress { color: var(--muted); font-size: .8rem; font-weight: 700; white-space: nowrap; }
    .progress span { color: #496535; margin-right: .3rem; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .card { position: relative; display: grid; grid-template-columns: 1fr auto; align-content: start; text-align: left; color: var(--ink); background: var(--card-bg); border: 1px solid var(--card-line); padding: 16px 18px; min-height: 146px; border-radius: 18px; transition: transform .2s, box-shadow .2s, border-color .2s; }
    .card:hover { transform: translateY(-4px); border-color: var(--purple); box-shadow: 0 8px 20px #31462214; }
    .laugh { --card-bg: #eff5e3; --card-line: #bfd0a5; --icon-bg: #d8e7c0; --icon-color: #476331; }
    .memory { --card-bg: #e5efd5; --card-line: #b8cca0; --icon-bg: #d1e1b6; --icon-color: #415c2e; }
    .gift { --card-bg: #f0f5e7; --card-line: #c1d2aa; --icon-bg: #dce8c8; --icon-color: #476331; }
    .card-icon { display: grid; place-items: center; width: 37px; height: 37px; background: var(--icon-bg); color: var(--icon-color); border-radius: 11px; font-size: 1.2rem; }
    .card-title { grid-column: 1 / -1; margin-top: 10px; font-family: var(--display); font-size: 1.85rem; line-height: 1; }
    .card-copy { grid-column: 1 / -1; margin-top: 6px; color: var(--muted); font-size: .86rem; }
    .card-arrow { justify-self: end; align-self: center; color: var(--icon-color); font-size: 1.08rem; }
    .footer { margin-top: 27px; border-top: 1px solid var(--line); min-height: 60px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: .78rem; }
    .footer span { margin-right: .35rem; color: var(--purple); }

    .detail { max-width: 800px; margin-inline: auto; }
    .back { display: inline-flex; align-items: center; gap: .5rem; border: 0; background: transparent; color: var(--purple); padding: .45rem 0; margin: 0 0 15px; font-weight: 700; font-size: .9rem; }
    .back:hover { text-decoration: underline; text-underline-offset: 3px; }
    .detail-panel { position: relative; border: 1px solid var(--card-line, var(--line)); background: var(--card-bg, #f4f8ec); border-radius: 25px; padding: clamp(22px, 6vw, 56px); }
    .detail h2 { font-size: clamp(2.65rem, 7vw, 4.5rem); margin: 13px 0 16px; }
    .detail h3 { font-size: 2rem; margin-bottom: 10px; }
    .detail p { color: var(--muted); }
    .step-count { display: block; color: var(--icon-color); font-size: .8rem; font-weight: 700; margin-bottom: 10px; }
    .inset { border-radius: 17px; background: #ffffff83; border: 1px solid var(--card-line); padding: clamp(17px, 4vw, 27px); margin-top: 22px; }
    .inset p { max-width: 55ch; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .photo { position: relative; margin-top: 17px; width: min(100%, 380px); overflow: hidden; border: 6px solid #fff; border-bottom-width: 16px; border-radius: 8px; box-shadow: 0 4px 12px #3146221a; }
    .photo img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .laugh .photo img { aspect-ratio: auto; height: auto; }
    .photo-placeholder { display: grid; min-height: 155px; aspect-ratio: 4 / 3; place-content: center; text-align: center; gap: .35rem; background: radial-gradient(ellipse at 20% 0%, #edf3df, transparent 62%), linear-gradient(145deg, #d8e5c0, #bfd3a0); color: #405c2e; font-size: .85rem; font-weight: 700; }
    .photo-placeholder span { font-size: 1.6rem; }
    .photo + .actions { margin-top: 23px; }
    .memory-photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 16px; margin-top: 17px; }
    .memory-photos .photo { width: 100%; margin: 0; }
    .memory .photo img { aspect-ratio: auto; height: auto; }
    @media (max-width: 570px) {
      .memory-photos { grid-template-columns: 1fr; }
    }
    .letter-stage { position: relative; isolation: isolate; width: 100%; margin-top: 28px; }
    .letter-stage.is-open .envelope-scene {
      position: absolute;
      inset: 0 0 auto;
      pointer-events: none;
      animation: envelope-disappear .25s ease .42s both;
    }
    @keyframes envelope-disappear { to { opacity: 0; visibility: hidden; } }
    .envelope-scene {
      display: grid;
      justify-items: center;
      padding: 0;
      text-align: center;
    }
    .letter-envelope {
      display: grid;
      width: min(100%, 330px);
      justify-items: center;
      gap: 10px;
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--purple);
      font-size: .88rem;
      font-weight: 700;
      animation: envelope-arrive .6s cubic-bezier(.2, .8, .25, 1.3) both;
    }
    .envelope-box {
      position: relative;
      isolation: isolate;
      display: block;
      width: 100%;
      aspect-ratio: 1.62;
      border-radius: 12px;
      background: #a4bc80;
      box-shadow: 0 13px 23px #31462226;
      perspective: 650px;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .letter-envelope:hover:not(:disabled) .envelope-box {
      transform: translateY(-4px);
      box-shadow: 0 16px 25px #31462235;
    }
    .envelope-insert, .envelope-front, .envelope-fold, .envelope-flap, .envelope-seal {
      position: absolute;
      pointer-events: none;
    }
    .envelope-insert {
      inset: 12% 9% 9%;
      border-radius: 6px;
      border: 1px solid #c9d7b4;
      background: #f5f8ed;
    }
    .envelope-front {
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(105deg, #c9dcae, #b7cc98);
      clip-path: polygon(0 0, 50% 53%, 100% 0, 100% 100%, 0 100%);
    }
    .envelope-fold {
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(160deg, #c3d6a5, #dce8c6);
      clip-path: polygon(0 100%, 50% 46%, 100% 100%);
    }
    .envelope-flap {
      inset: 0;
      height: 63%;
      z-index: 1;
      border-radius: 12px 12px 0 0;
      background: linear-gradient(#e4edce, #c1d69f);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
    }
    .envelope-seal {
      top: 54%;
      left: 50%;
      z-index: 2;
      display: grid;
      place-items: center;
      width: clamp(28px, 8vw, 38px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #638044;
      box-shadow: 0 2px 5px #31462246;
      color: #f5f9ee;
      font-size: 1.1rem;
      transform: translate(-50%, -50%);
    }
    .envelope-scene.is-open .envelope-flap { animation: envelope-unseal .38s ease-in-out both; }
    .envelope-scene.is-open .envelope-insert { animation: letter-rise .42s ease-out .14s both; }
    .envelope-scene.is-open .envelope-seal { animation: seal-release .18s ease-out both; }
    .letter-panel {
      width: 100%;
      max-width: 800px;
      margin-inline: auto;
      background: linear-gradient(145deg, #f5f8ed, #e9f0db);
      border-color: #bacda0;
      box-shadow: 0 10px 28px #31462214;
      animation: letter-unfold .44s cubic-bezier(.19, 1, .22, 1) .37s both;
    }
    .letter-panel h2 { font-size: clamp(1.9rem, 4vw, 2.5rem); margin: 10px 0 18px; }
    .hero .letter-panel { padding: clamp(20px, 3vw, 30px); }
    .hero .letter-panel p { max-width: none; margin: 0; font-size: .94rem; }
    .hero .letter-panel p + p { margin-top: 14px; }
    .hero .letter-panel .signature { margin-top: 20px; font-size: 1.6rem; }
    .letter-panel .greeting { margin-bottom: 2px; font-size: 1.4rem; }
    .letter-panel p { max-width: 56ch; }
    .letter-panel p + p { margin-top: .9rem; }
    .letter-panel .signature { margin-top: 1.3rem; color: var(--purple); font-family: var(--display); font-size: 1.7rem; font-style: italic; }
    [data-view]:not([hidden]) { animation: appear .3s ease-out both; }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes envelope-arrive { from { opacity: 0; transform: translateY(24px) rotate(-5deg) scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes envelope-unseal { to { transform: rotateX(-177deg); z-index: -1; } }
    @keyframes letter-rise { to { transform: translateY(-45%); } }
    @keyframes seal-release { to { opacity: 0; transform: translate(-50%, -65%) scale(.82); } }
    @keyframes letter-unfold { from { opacity: 0; transform: translateY(34px) scale(.97); } to { opacity: 1; transform: none; } }

    @media (max-width: 760px) {
      .wrap { width: calc(100% - 38px); }
      .hero { min-height: 350px; }
      .hero h1 { font-size: clamp(3.1rem, 8vw, 4.4rem); }
      .hero-content { padding-left: 25px; }
      .card { padding: 14px; }
      .card-title { font-size: 1.65rem; }
    }
    @media (max-width: 570px) {
      .wrap { width: calc(100% - 28px); }
      .masthead { min-height: 61px; flex-wrap: wrap; padding-block: 12px; gap: 10px; }
      .masthead-actions { width: 100%; justify-content: space-between; gap: 10px; }
      .masthead-actions .button { min-height: 40px; font-size: .82rem; }
      main { padding-top: 17px; }
      .hero { grid-template-columns: 1fr; }
      .hero-content { align-items: center; text-align: center; padding: 23px 15px 8px; }
      .greeting { margin-bottom: 12px; }
      .hero h1 { font-size: clamp(2.95rem, 11.4vw, 4rem); }
      .hero p { margin: 13px 0 17px; font-size: .92rem; }
      .hero-art { min-height: 174px; padding: 10px 22px 22px; }
      .hero-art img { width: min(100%, 260px); }
      
      .choices { margin-top: 22px; }
      .choices-head { flex-wrap: wrap; margin-bottom: 11px; }
      .cards { grid-template-columns: 1fr; gap: 9px; }
      .card { grid-template-columns: auto 1fr auto; column-gap: 10px; min-height: 83px; align-content: center; }
      .card-icon { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
      .card-title { grid-column: 2; grid-row: 1; margin-top: 0; }
      .card-copy { grid-column: 2; grid-row: 2; margin-top: 4px; }
      .card-arrow { grid-column: 3; grid-row: 1 / span 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
      .letter-stage.is-open .envelope-scene { visibility: hidden; }
      .envelope-scene.is-open .envelope-flap { transform: rotateX(-177deg); z-index: -1; }
      .envelope-scene.is-open .envelope-insert { transform: translateY(-45%); }
      .envelope-scene.is-open .envelope-seal { opacity: 0; }
    }
    .poem-stage { width: 100%; max-width: 600px; margin: 30px auto 0; }
    .poem-paper { padding: clamp(22px, 4vw, 38px); border: 1px solid var(--line); border-radius: 20px; }
    .detail .poem-message { color: var(--ink); font-size: clamp(2rem, 5vw, 3rem); line-height: 1.14; margin: 0; }
    .detail .poem-postscript { font-size: 1.06rem; line-height: 1.65; margin-top: 24px; }
    body.watching-intro { overflow: hidden; background: #11170f; }
    .video-intro { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; width: 100%; height: 100vh; height: 100dvh; background: #11170f; }
    .video-intro video { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; background: #11170f; }
    .intro-enter { position: absolute; z-index: 1; top: calc(16px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right)); min-height: 44px; border: 1px solid #ffffff85; background: #293720e8; box-shadow: 0 3px 14px #00000035; }
  </style>
</head>

    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const escapeText = value => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);

    byId('date').textContent = CONTENIDO.fecha;

    function renderCards() {
      byId('cards').innerHTML = Object.entries(routes).map(([key, item]) => `

          <span class="card-icon" aria-hidden="true">${item.icon}</span>
          <span class="card-arrow" ${completed.has(key) ? 'aria-label="Sorpresa descubierta"' : 'aria-hidden="true"'}>${completed.has(key) ? '♥' : '↗'}</span>
          <span class="card-title">${item.label}</span>

        </button>`).join('');
      byId('progress').textContent = `${completed.size} de ${Object.keys(routes).length}`;

    function markComplete() {
      completed.add(route);
      try { localStorage.setItem(storageKey, JSON.stringify([...completed])); } catch { /* Conserva el progreso de esta visita. */ }
    }

    function showView(view, focusId, top = true) {
      if (view !== 'home') byId('birthday-video').pause();
      if (view !== 'route') routePanel.querySelector('audio')?.pause();
      for (const panel of viewPanels) panel.hidden = panel.dataset.view !== view;
      byId(focusId).focus({ preventScroll: true });
      if (top) window.scrollTo(0, 0);
    }

    function showHome(atChoices = false) {

    function goToChoices(smooth) {

      byId('letter-paper').hidden = true;

    function renderRoute() {

      markComplete();
      byId('poem-stage').classList.add('is-open');
      byId('poem-scene').classList.add('is-open');
      byId('poem-envelope').setAttribute('aria-expanded', 'true');
      byId('poem-paper').hidden = false;
      byId('poem-actions').hidden = false;
      byId('poem-message').focus({ preventScroll: true });
      byId('poem-scene').inert = true;
    }

    function closePoem() {
      revealed = false;
      byId('poem-paper').hidden = true;
      byId('poem-actions').hidden = true;
      byId('poem-stage').classList.remove('is-open');
      byId('poem-scene').classList.remove('is-open');
      byId('poem-scene').inert = false;
      byId('poem-envelope').setAttribute('aria-expanded', 'false');
      byId('poem-envelope').focus({ preventScroll: true });
    }

    function enterPage() {
      byId('birthday-video').pause();
      byId('video-intro').hidden = true;
      byId('birthday-page').hidden = false;
      byId('birthday-page').inert = false;
      document.body.classList.remove('watching-intro');
      byId('title').focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }

    byId('birthday-video').addEventListener('ended', enterPage);

    document.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.id === 'enter-page') {
        enterPage();
      } else if (button.id === 'start') {
        goToChoices(true);
      } else if (button.hasAttribute('data-home') || button.hasAttribute('data-menu')) {
        showHome(button.hasAttribute('data-menu'));
      } else if (button.dataset.route) {
        route = button.dataset.route;
        step = 0;
        revealed = false;
        if (route === 'laugh' && CONTENIDO.risa.pasos.length === 1) markComplete();
        renderRoute();
        showView('route', 'route-title');
      } else if (button.hasAttribute('data-next') || button.hasAttribute('data-reveal')) {
        if (route === 'laugh') {
          step += 1;
          if (step === CONTENIDO.risa.pasos.length - 1) markComplete();
        } else {
          revealed = true;
          markComplete();
        }
        renderRoute();
        byId('reveal-title').focus();
      } else if (button.id === 'poem-envelope') {
        openPoem();
      } else if (button.hasAttribute('data-close-poem')) {
        closePoem();
      } else if (button.id === 'letter-envelope') {
        if (byId('letter-paper').hidden) openLetter();
        else closeLetter();
      } else if (button.hasAttribute('data-close-letter')) {
        closeLetter();
      }
    });

    renderCards();
  </script>
</body>
</html>
